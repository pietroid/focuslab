name: focus
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: "^3.7.0"

dependencies:
  app_ui: 
    path: packages/app_ui
  bloc: ^9.2.0
  currency_text_input_formatter: ^2.2.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gen: any
  flutter_localizations:
    sdk: flutter
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  intl: ^0.20.0
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  rxdart: ^0.28.0
  equatable: ^2.0.7
  build_verify: ^3.1.1
  

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#001830"
  min_sdk_android: 21 # android min sdk min:16, default 21
